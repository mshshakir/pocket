# Deploys the Telegram bot Edge Function whenever its code changes on main
# (or on demand from the Actions tab).
#
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN
#   (Supabase dashboard → Account → Access Tokens → Generate new token;
#    GitHub → Settings → Secrets and variables → Actions → New repository secret).
#
# --no-verify-jwt: Telegram can't send a Supabase JWT; the webhook secret
# header is the gate instead (see supabase/functions/telegram-bot/index.ts).

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nvsfxdnnakzfzsrsfftp
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy telegram-bot
        run: supabase functions deploy telegram-bot --remote="$PROJECT_REF" --no-verify-jwt --yes

      # AI scans and voice entries. Only signed-in users may call it, so the
      # sign-in (JWT) check stays on. Needs the GEMINI_API_KEY function secret.
      - name: Deploy ai
        run: supabase functions deploy ai --remote="$PROJECT_REF" --yes

      # Razorpay payments. Razorpay's webhook can't send a Supabase sign-in, so
      # the gateway check is off; the function checks the user's sign-in itself
      # and checks webhooks by signature. Needs the RAZORPAY_* function secrets.
      - name: Deploy payments
        run: supabase functions deploy payments --remote="$PROJECT_REF" --no-verify-jwt --yes

      # Daily/weekly summaries for Telegram groups tied to a shared space.
      # Called hourly by pg_cron (migration 0022); it decides what's due and
      # posts each summary once, so it needs no sign-in check or secret.
      - name: Deploy telegram-summaries
        run: supabase functions deploy telegram-summaries --remote="$PROJECT_REF" --no-verify-jwt --yes
