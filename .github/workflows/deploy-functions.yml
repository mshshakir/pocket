# Deploys the Telegram bot Edge Function whenever its code changes on main
# (or on demand from the Actions tab).
#
# One-time setup: add a repository secret SUPABASE_ACCESS_TOKEN
#   (Supabase dashboard → Account → Access Tokens → Generate new token;
#    GitHub → Settings → Secrets and variables → Actions → New repository secret).
#
# --no-verify-jwt: Telegram can't send a Supabase JWT; the webhook secret
# header is the gate instead (see supabase/functions/telegram-bot/index.ts).

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nvsfxdnnakzfzsrsfftp
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy telegram-bot
        run: supabase functions deploy telegram-bot --remote="$PROJECT_REF" --no-verify-jwt --yes
