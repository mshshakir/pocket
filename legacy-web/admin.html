<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Pocket admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#fafafa;color:#18181b;font-size:14px}
  [data-lucide]{width:16px;height:16px;stroke-width:1.75;vertical-align:-3px}
  a{color:inherit} .muted{color:#71717a} .small{font-size:12.5px} .sub{color:#71717a;font-size:12px;margin-top:2px} .strong{font-weight:600} .mono{font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all}
  #admin{display:flex;min-height:100vh} #admin.busy{cursor:progress} #admin.busy .main{opacity:.75}
  .side{width:220px;flex-shrink:0;background:#fff;border-right:1px solid #e4e4e7;padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .logo{width:34px;height:34px;border-radius:10px;background:#18181b;color:#fff;display:grid;place-items:center;font-weight:700}
  nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:#3f3f46;font-weight:500}
  .nav-item:hover{background:#f4f4f5} .nav-item.on{background:#18181b;color:#fff}
  .side-foot{margin-top:auto;padding:8px;font-size:12px} .link{background:none;border:0;padding:0;color:#3f3f46;text-decoration:underline;cursor:pointer;font:inherit}
  .main{flex:1;min-width:0;padding:22px 28px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px} .top h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#71717a;margin:22px 0 10px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .tile{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:14px 16px}
  .tile-label{color:#71717a;font-size:12.5px} .tile-value{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.02em} .tile-note{color:#71717a;font-size:12px;margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .panel{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:16px 18px;margin-top:12px} .panel h3{margin:0 0 10px;font-size:15px}
  .chart{width:100%;height:auto} .chart .bar{fill:#10b981} .chart .bar-value{font-size:12px;fill:#18181b;font-weight:600} .chart .bar-label{font-size:11px;fill:#71717a} .chart .axis{stroke:#e4e4e7}
  .notice{background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:10px 14px;margin-bottom:6px} .notice.bad{background:#fef2f2;border-color:#fca5a5}
  .table-wrap{overflow-x:auto;background:#fff;border:1px solid #e4e4e7;border-radius:14px}
  .table{width:100%;border-collapse:collapse} .table th{text-align:left;font-weight:600;color:#71717a;font-size:12px;padding:10px 12px;border-bottom:1px solid #e4e4e7;white-space:nowrap}
  .table td{padding:10px 12px;border-bottom:1px solid #f4f4f5;vertical-align:top} .table tr:last-child td{border-bottom:0} .num{text-align:right;white-space:nowrap}
  .panel .table td,.panel .table th{padding-left:0}
  .row-open td{background:#fafafa} .row-panel td{background:#fafafa}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
  .input{border:1px solid #e4e4e7;border-radius:9px;padding:7px 10px;font:inherit;background:#fff;min-width:0} .input:focus{outline:none;border-color:#a1a1aa}
  .input-sm{padding:5px 8px;font-size:13px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #18181b;background:#18181b;color:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#3f3f46} .btn:disabled{opacity:.5;cursor:default}
  .btn-soft{background:#fff;color:#18181b;border-color:#e4e4e7} .btn-soft:hover{background:#f4f4f5}
  .btn-danger{background:#fff;color:#b91c1c;border-color:#fecaca} .btn-danger:hover{background:#fef2f2}
  .btn-sm{padding:5px 9px;font-size:12.5px}
  .pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;background:#f4f4f5;color:#52525b}
  .pill-good{background:#dcfce7;color:#166534} .pill-warn{background:#fef3c7;color:#92400e} .pill-bad{background:#fee2e2;color:#991b1b} .pill-accent{background:#e0e7ff;color:#3730a3}
  .manage{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .mini{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:12px} .mini-title{font-weight:600}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px} .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#52525b} .form-grid .wide{grid-column:1/-1}
  .label{color:#71717a;font-size:12px;margin-right:4px}
  .check{display:inline-flex !important;flex-direction:row !important;align-items:center;gap:6px;font-size:13px;color:#18181b !important} .checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
  .plan-row,.batch-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 10px;padding:8px 0}
  .plan-row label,.batch-row label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#52525b} .plan-row .input,.batch-row .input{width:120px} .code{min-width:60px;align-self:center}
  .subtabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px}
  .subtab{border:1px solid #e4e4e7;background:#fff;border-radius:9px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer} .subtab.on{background:#18181b;color:#fff;border-color:#18181b}
  .count{font-weight:500;opacity:.7;margin-left:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px} .chip{border:1px solid #e4e4e7;background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;text-transform:capitalize} .chip.on{background:#e0e7ff;border-color:#c7d2fe;color:#3730a3;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .card-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap} .pos{color:#71717a;font-weight:600}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px} .card-grid .wide{grid-column:1/-1}
  .card-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center} .inline{display:inline-flex;gap:6px} .notes{display:flex;gap:6px} .notes .input{flex:1}
  .tracker{border-collapse:collapse;font-size:12px} .tracker th,.tracker td{border-bottom:1px solid #f4f4f5;padding:4px 0;text-align:center}
  .tracker th.who{text-align:left;padding-right:12px;min-width:170px;font-weight:600;position:sticky;left:0;background:#fff}
  .tracker .day{width:26px;color:#71717a;font-weight:500} .tracker .wk{border-left:1px solid #e4e4e7} .tracker .today{color:#18181b;font-weight:700}
  .tick{width:26px;height:28px;cursor:pointer;user-select:none} .tick:hover{background:#f4f4f5} .tick.yes{color:#15803d;font-weight:700;background:#f0fdf4} .tick.no{color:#b91c1c;background:#fef2f2}
  .person{border-top:1px solid #f4f4f5;padding:10px 0} .person:first-of-type{border-top:0} .call{background:#fafafa;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px} .call-form{margin-top:8px}
  .gate{margin:12vh auto;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px} .gate h1{margin:6px 0 0;font-size:22px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.15);max-width:90vw;z-index:50} .toast.bad{background:#b91c1c}
  @media (max-width:820px){#admin{flex-direction:column}.side{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid #e4e4e7;padding:10px}.brand{padding-bottom:8px} nav{flex-direction:row;overflow-x:auto}.nav-item span{display:none}.side-foot{display:none}.main{padding:16px}.grid2{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="admin"><div class="gate"><div class="logo">P</div><p class="muted">Loading…</p></div></div>
<script type="module">
  import { PocketSession } from './src/web/PocketSession.js';
  import { AdminApp } from './src/admin/AdminApp.js';
  const root = document.getElementById('admin');
  try {
    await new AdminApp(new PocketSession(), root).start();
  } catch (e) {
    root.innerHTML = '<div class="gate"><p>Could not load: ' + String(e && e.message || e).replace(/[<>&]/g, '') + '</p></div>';
  }
</script>
</body>
</html>
